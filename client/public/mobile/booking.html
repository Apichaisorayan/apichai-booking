    <script>
        // ============================================================================
        // CONFIGURATION
        // ============================================================================

        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8787'
            : window.location.hostname.match(/^192\.168\.\d+\.\d+$/) || window.location.hostname.match(/^10\.\d+\.\d+\.\d+$/)
            ? `http://${window.location.hostname}:8787`
            : window.location.hostname.includes('qa.')
                ? 'https://beauty-clinic-api-qa.apichais-leo01.workers.dev'
                : 'https://beauty-clinic-api.apichais-leo01.workers.dev';

        // ============================================================================
        // STATE MANAGEMENT
        // ============================================================================

        let doctors = [];
        let machines = [];
        let rooms = [];
        let selectedMachine = null;
        let selectedRoom = null;
        let editingBookingId = null; // Store booking ID if editing

        // ============================================================================
        // AUTHENTICATION
        // ============================================================================

        function checkAuth() {
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return null;
            }
            return token;
        }

        // ============================================================================
        // API HELPERS
        // ============================================================================

        async function apiCall(endpoint, options = {}) {
            const token = checkAuth();
            if (!token) return null;

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };

            try {
                console.log('API Request:', endpoint, options.body ? JSON.parse(options.body) : '');

                const response = await fetch(`${API_URL}${endpoint}`, {
                    ...options,
                    headers
                });

                const responseData = await response.json();
                console.log('API Response:', response.status, responseData);

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = '/';
                        return null;
                    }
                    throw new Error(responseData.error || responseData.message || `HTTP ${response.status}`);
                }

                return responseData;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        async function deleteGoogleCalendarEvent(token, eventId) {
            const response = await fetch(`${API_URL}/api/calendar/events/${eventId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Origin': window.location.origin,
                },
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({ error: 'Unknown error' }));
                throw new Error(error.error || `HTTP ${response.status}`);
            }

            return response.json();
        }

        // ============================================================================
        // UI HELPERS - DIALOGS
        // ============================================================================

        function showLoading() {
            const profileMenu = document.getElementById('profileMenu');
            if (profileMenu) {
                profileMenu.classList.add('hidden');
            }
            document.getElementById('loadingDialog').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingDialog').classList.add('hidden');
        }

        function showNotification(title, message, type = 'info') {
            const dialog = document.getElementById('notificationDialog');
            const icon = document.getElementById('notificationIcon');
            const iconSpan = icon.querySelector('.material-symbols-outlined');
            const titleEl = document.getElementById('notificationTitle');
            const messageEl = document.getElementById('notificationMessage');
            const okBtn = document.getElementById('notificationOkBtn');

            titleEl.textContent = title;
            messageEl.textContent = message;

            // Reset classes
            icon.className = 'flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full';
            okBtn.className = 'w-full px-4 py-2.5 rounded-xl font-medium hover:opacity-90 transition';

            if (type === 'error') {
                icon.classList.add('bg-red-100', 'dark:bg-red-900/20');
                iconSpan.className = 'material-symbols-outlined text-red-600 dark:text-red-400 text-2xl';
                iconSpan.textContent = 'error';
                okBtn.classList.add('bg-red-600', 'text-white');
            } else if (type === 'success') {
                icon.classList.add('bg-green-100', 'dark:bg-green-900/20');
                iconSpan.className = 'material-symbols-outlined text-green-600 dark:text-green-400 text-2xl';
                iconSpan.textContent = 'check_circle';
                okBtn.classList.add('bg-green-600', 'text-white');
            } else {
                icon.classList.add('bg-blue-100', 'dark:bg-blue-900/20');
                iconSpan.className = 'material-symbols-outlined text-blue-600 dark:text-blue-400 text-2xl';
                iconSpan.textContent = 'info';
                okBtn.classList.add('bg-primary', 'text-white');
            }

            dialog.classList.remove('hidden');

            const handleOk = () => {
                dialog.classList.add('hidden');
                okBtn.removeEventListener('click', handleOk);
            };

            okBtn.addEventListener('click', handleOk);
        }

        function showConfirmDialog(title, message) {
            return new Promise((resolve) => {
                const dialog = document.getElementById('confirmDialog');
                const titleEl = document.getElementById('confirmTitle');
                const messageEl = document.getElementById('confirmMessage');
                const okBtn = document.getElementById('confirmOkBtn');
                const cancelBtn = document.getElementById('confirmCancelBtn');

                titleEl.textContent = title;
                messageEl.textContent = message;
                dialog.classList.remove('hidden');

                const handleOk = () => {
                    dialog.classList.add('hidden');
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(true);
                };

                const handleCancel = () => {
                    dialog.classList.add('hidden');
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(false);
                };

                okBtn.addEventListener('click', handleOk);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        // ============================================================================
        // UI HELPERS - PROFILE MENU
        // ============================================================================

        function toggleProfileMenu() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        async function handleLogout() {
            document.getElementById('profileMenu').classList.add('hidden');
            const confirmed = await showConfirmDialog(
                'ออกจากระบบ',
                'คุณต้องการออกจากระบบใช่หรือไม่?'
            );

            if (confirmed) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('google_calendar_token');
                sessionStorage.removeItem('google_calendar_refresh_token');
                window.location.href = '/';
            }
        }

        // Close profile menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('profileMenu');
            const profileBtn = document.getElementById('profileBtn');
            if (!menu.contains(e.target) && !profileBtn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // ============================================================================
        // DATA LOADING
        // ============================================================================

        // Check for booking conflicts (overlapping time slots)
        async function checkBookingConflicts(date, startTime, endTime, roomId, machineId, doctorId, excludeBookingId = null) {
            try {
                // Get all bookings for the selected date
                const bookingsData = await apiCall(`/api/bookings/date/${date}`);
                const bookings = bookingsData?.filter(b => b.status === 'CONFIRMED') || [];

                const conflicts = {
                    doctor: [],
                    room: [],
                    machine: []
                };

                const [newStartHour, newStartMin] = startTime.split(':').map(Number);
                const [newEndHour, newEndMin] = endTime.split(':').map(Number);
                const newStartMinutes = newStartHour * 60 + newStartMin;
                const newEndMinutes = newEndHour * 60 + newEndMin;

                for (const booking of bookings) {
                    // Skip if this is the booking being edited
                    if (excludeBookingId && booking.id === excludeBookingId) {
                        continue;
                    }

                    // Check time overlap first
                    const [bookingStartHour, bookingStartMin] = booking.start_time.split(':').map(Number);
                    const [bookingEndHour, bookingEndMin] = booking.end_time.split(':').map(Number);
                    const bookingStartMinutes = bookingStartHour * 60 + bookingStartMin;
                    const bookingEndMinutes = bookingEndHour * 60 + bookingEndMin;

                    // Check if times overlap
                    const hasOverlap = (newStartMinutes < bookingEndMinutes && newEndMinutes > bookingStartMinutes);

                    if (!hasOverlap) {
                        continue; // No time overlap, skip
                    }

                    // Check conflicts
                    const sameDoctor = booking.doctor_id === doctorId;
                    const sameRoom = booking.room_id === roomId;
                    const sameMachine = booking.machine_id === machineId;

                    if (sameDoctor) {
                        conflicts.doctor.push({
                            booking: booking,
                            time: `${booking.start_time.substring(0, 5)} - ${booking.end_time.substring(0, 5)}`
                        });
                    }

                    if (sameRoom) {
                        conflicts.room.push({
                            booking: booking,
                            time: `${booking.start_time.substring(0, 5)} - ${booking.end_time.substring(0, 5)}`
                        });
                    }

                    if (sameMachine) {
                        conflicts.machine.push({
                            booking: booking,
                            time: `${booking.start_time.substring(0, 5)} - ${booking.end_time.substring(0, 5)}`
                        });
                    }
                }

                return conflicts;
            } catch (error) {
                console.error('Error checking conflicts:', error);
                return { doctor: [], room: [], machine: [] };
            }
        }

        // Show doctor conflict error (blocking)
        function showDoctorConflictError(conflicts) {
            const timeList = conflicts.map(c => c.time).join(', ');

            showNotification(
                '❌ หมอไม่ว่าง',
                `หมอกำลังดำเนินการในช่วงเวลา ${timeList}\n\nกรุณาเลือกเวลาถัดไป`,
                'error'
            );
        }

        // Show room/machine conflict warning (can proceed)
        async function showResourceConflictWarning(roomConflicts, machineConflicts) {
            let message = '';

            if (roomConflicts.length > 0) {
                const timeList = roomConflicts.map(c => c.time).join(', ');
                message += `มีการจองห้องนี้แล้วในเวลา ${timeList}`;
            }

            if (machineConflicts.length > 0) {
                if (message) message += '\n\n';
                const timeList = machineConflicts.map(c => c.time).join(', ');
                message += `มีการจองเครื่องมือนี้แล้วในเวลา ${timeList}`;
            }

            message += '\n\nต้องการบันทึกต่อหรือไม่?';

            return await showConfirmDialog('⚠️ พบการจองซ้ำ', message);
        }

        async function loadUserInfo() {
            try {
                const user = JSON.parse(sessionStorage.getItem('user') || '{}');
                if (user.name) {
                    const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);

                    // Update profile button
                    const profileBtn = document.getElementById('profileBtn');
                    if (profileBtn) {
                        profileBtn.textContent = initials;
                    }

                    // Update booker card in form
                    const bookerCard = document.getElementById('bookerCard');
                    if (bookerCard) {
                        bookerCard.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm">
                                ${initials}
                            </div>
                            <div>
                                <div class="font-semibold text-sm text-gray-900 dark:text-white">${user.name}</div>
                                <span class="inline-block px-2 py-0.5 rounded-md bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-[10px] font-medium border border-gray-200 dark:border-gray-700">${user.role || 'USER'}</span>
                            </div>
                        `;
                    }

                    // Update profile menu if exists
                    const profileName = document.getElementById('profileName');
                    const profileEmail = document.getElementById('profileEmail');
                    if (profileName) profileName.textContent = user.name || 'User';
                    if (profileEmail) profileEmail.textContent = user.email || '';
                }
            } catch (error) {
                console.error('Error loading user:', error);
            }
        }

        // Load booking data for editing
        async function loadBookingForEdit() {
            try {
                const booking = await apiCall(`/api/bookings/${editingBookingId}`);
                
                if (!booking) {
                    showNotification('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลการจองได้', 'error');
                    return;
                }

                // Populate form fields with booking data
                const doctorSelect = document.querySelectorAll('select')[0];
                const machineSelect = document.querySelectorAll('select')[1];
                const roomSelect = document.querySelectorAll('select')[2];
                const patientInput = document.querySelector('input[placeholder="กรอกชื่อผู้ป่วย"]');
                const dateInput = document.getElementById('dateInput');
                const startTimeInput = document.getElementById('startTimeInput');
                const endTimeInput = document.getElementById('endTimeInput');
                const notesTextarea = document.querySelector('textarea');

                // Set values with a small delay to ensure dropdowns are populated
                setTimeout(() => {
                    if (booking.doctor_id) {
                        doctorSelect.value = booking.doctor_id;
                        selectedDoctor = doctors.find(d => d.id === booking.doctor_id);
                    }
                    if (booking.machine_id) {
                        machineSelect.value = booking.machine_id;
                        selectedMachine = machines.find(m => m.id === booking.machine_id);
                        updateRoomOptions(); // Update available rooms based on machine
                    }
                    if (booking.room_id) {
                        setTimeout(() => {
                            roomSelect.value = booking.room_id;
                            selectedRoom = rooms.find(r => r.id === booking.room_id);
                        }, 100);
                    }
                    
                    if (patientInput && booking.patient_name) {
                        patientInput.value = booking.patient_name;
                    }
                    if (dateInput && booking.date) {
                        dateInput.value = booking.date.split('T')[0];
                    }
                    if (startTimeInput && booking.start_time) {
                        startTimeInput.value = booking.start_time.substring(0, 5);
                    }
                    if (endTimeInput && booking.end_time) {
                        endTimeInput.value = booking.end_time.substring(0, 5);
                    }
                    if (notesTextarea && booking.notes) {
                        notesTextarea.value = booking.notes;
                    }
                }, 300);
                
            } catch (error) {
                console.error('Error loading booking:', error);
                showNotification('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลการจองได้', 'error');
            }
        }

        // Load doctors
        async function loadDoctors() {
            try {
                const users = await apiCall('/api/users');
                doctors = users?.filter(u => u.role === 'DOCTOR') || [];

                const doctorSelect = document.querySelectorAll('select')[0];
                if (doctorSelect) {
                    doctorSelect.innerHTML = '<option value="" disabled selected>เลือกหมอ</option>' +
                        doctors.map(d => `<option value="${d.id}">${d.name}</option>`).join('');

                    doctorSelect.addEventListener('change', (e) => {
                        selectedDoctor = doctors.find(d => d.id === e.target.value);
                    });
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        // Load machines
        async function loadMachines() {
            try {
                machines = await apiCall('/api/machines?category=MEDICAL');

                const machineSelect = document.querySelectorAll('select')[1];
                if (machineSelect) {
                    machineSelect.innerHTML = '<option value="" disabled selected>เลือกเครื่องมือ</option>' +
                        machines.map(m => `<option value="${m.id}">${m.name} (${m.type === 'FIXED' ? 'ติดห้อง' : 'ย้ายได้'})</option>`).join('');

                    machineSelect.addEventListener('change', (e) => {
                        selectedMachine = machines.find(m => m.id === e.target.value);
                        updateRoomOptions();
                    });
                }
            } catch (error) {
                console.error('Error loading machines:', error);
            }
        }

        // Load rooms
        async function loadRooms() {
            try {
                rooms = await apiCall('/api/rooms?type=PROCEDURE');
                updateRoomOptions();
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        // Update room options based on selected machine
        function updateRoomOptions() {
            const roomSelect = document.querySelectorAll('select')[2];
            if (!roomSelect || !rooms) return;

            if (!selectedMachine) {
                roomSelect.innerHTML = '<option value="" disabled selected>เลือกห้อง</option>' +
                    rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            } else if (selectedMachine.type === 'FIXED') {
                // For FIXED machines, only show the room it's fixed to
                const fixedRoom = rooms.find(r => r.id === selectedMachine.room_id);
                if (fixedRoom) {
                    roomSelect.innerHTML = `<option value="${fixedRoom.id}" selected>${fixedRoom.name} (ห้องของเครื่อง)</option>`;
                    selectedRoom = fixedRoom;
                } else {
                    roomSelect.innerHTML = '<option value="" disabled selected>ไม่พบห้องสำหรับเครื่องนี้</option>';
                    selectedRoom = null;
                }
            } else {
                // For MOVABLE machines, show all rooms
                roomSelect.innerHTML = '<option value="" disabled selected>เลือกห้อง</option>' +
                    rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
                selectedRoom = null;
            }

            roomSelect.addEventListener('change', (e) => {
                selectedRoom = rooms.find(r => r.id === e.target.value);
            });
        }

        // Show notification
        function showNotification(title, message, type = 'info') {
            const dialog = document.getElementById('notificationDialog');
            const icon = document.getElementById('notificationIcon');
            const iconSpan = icon.querySelector('.material-symbols-outlined');
            const titleEl = document.getElementById('notificationTitle');
            const messageEl = document.getElementById('notificationMessage');
            const okBtn = document.getElementById('notificationOkBtn');

            titleEl.textContent = title;
            messageEl.textContent = message;

            // Reset classes
            icon.className = 'flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full';
            okBtn.className = 'w-full px-4 py-2.5 rounded-xl font-medium hover:opacity-90 transition';

            if (type === 'error') {
                icon.classList.add('bg-red-100', 'dark:bg-red-900/20');
                iconSpan.className = 'material-symbols-outlined text-red-600 dark:text-red-400 text-2xl';
                iconSpan.textContent = 'error';
                okBtn.classList.add('bg-red-600', 'text-white');
            } else if (type === 'success') {
                icon.classList.add('bg-green-100', 'dark:bg-green-900/20');
                iconSpan.className = 'material-symbols-outlined text-green-600 dark:text-green-400 text-2xl';
                iconSpan.textContent = 'check_circle';
                okBtn.classList.add('bg-green-600', 'text-white');
            } else {
                icon.classList.add('bg-blue-100', 'dark:bg-blue-900/20');
                iconSpan.className = 'material-symbols-outlined text-blue-600 dark:text-blue-400 text-2xl';
                iconSpan.textContent = 'info';
                okBtn.classList.add('bg-primary', 'text-white');
            }

            dialog.classList.remove('hidden');

            const handleOk = () => {
                dialog.classList.add('hidden');
                okBtn.removeEventListener('click', handleOk);
            };

            okBtn.addEventListener('click', handleOk);
        }

        // Handle form submission
        async function handleSubmit(event) {
            event.preventDefault();

            const doctorSelect = document.querySelectorAll('select')[0];
            const machineSelect = document.querySelectorAll('select')[1];
            const roomSelect = document.querySelectorAll('select')[2];
            const patientInput = document.querySelector('input[placeholder="กรอกชื่อผู้ป่วย"]');
            const dateInput = document.getElementById('dateInput');
            const startTimeInput = document.getElementById('startTimeInput');
            const endTimeInput = document.getElementById('endTimeInput');
            const notesTextarea = document.querySelector('textarea');

            const formData = {
                doctor_id: doctorSelect.value,
                machine_id: machineSelect.value,
                room_id: roomSelect.value,
                patient_name: patientInput.value,
                date: dateInput.value,
                start_time: startTimeInput.value + ':00',
                end_time: endTimeInput.value + ':00',
                notes: notesTextarea.value,
                booking_type: 'PROCEDURE'
            };

            // Validate time range
            if (startTimeInput.value && endTimeInput.value) {
                const [startHours, startMinutes] = startTimeInput.value.split(':').map(Number);
                const [endHours, endMinutes] = endTimeInput.value.split(':').map(Number);

                const startTotalMinutes = startHours * 60 + startMinutes;
                const endTotalMinutes = endHours * 60 + endMinutes;

                if (endTotalMinutes <= startTotalMinutes) {
                    showNotification('เวลาไม่ถูกต้อง', 'เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น', 'error');
                    return;
                }
            }

            // Validate date is not in the past
            if (dateInput.value) {
                const selectedDate = new Date(dateInput.value);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                selectedDate.setHours(0, 0, 0, 0);

                if (selectedDate < today) {
                    showNotification('วันที่ไม่ถูกต้อง', 'ไม่สามารถจองย้อนหลังได้', 'error');
                    return;
                }
            }

            // Validate patient name is not empty or just spaces
            if (!patientInput.value || patientInput.value.trim() === '') {
                showNotification('ข้อมูลไม่ครบถ้วน', 'กรุณากรอกชื่อผู้ป่วย', 'error');
                return;
            }

            // Validate patient name length
            if (patientInput.value.trim().length < 2) {
                showNotification('ชื่อไม่ถูกต้อง', 'ชื่อผู้ป่วยต้องมีอย่างน้อย 2 ตัวอักษร', 'error');
                return;
            }

            if (!formData.doctor_id || !formData.machine_id || !formData.room_id || !formData.patient_name) {
                showNotification('ข้อมูลไม่ครบถ้วน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                return;
            }

            // Validate date is selected
            if (!dateInput.value) {
                showNotification('ข้อมูลไม่ครบถ้วน', 'กรุณาเลือกวันที่', 'error');
                return;
            }

            try {
                showLoading();

                // Check for booking conflicts
                const conflicts = await checkBookingConflicts(
                    formData.date,
                    startTimeInput.value,
                    endTimeInput.value,
                    formData.room_id,
                    formData.machine_id,
                    formData.doctor_id
                );

                // Check doctor conflict first (blocking - cannot proceed)
                if (conflicts.doctor.length > 0) {
                    hideLoading();
                    showDoctorConflictError(conflicts.doctor);
                    return; // Stop here, cannot proceed
                }

                // Check room/machine conflicts (warning - can proceed)
                if (conflicts.room.length > 0 || conflicts.machine.length > 0) {
                    hideLoading();
                    const confirmed = await showResourceConflictWarning(conflicts.room, conflicts.machine);
                    if (!confirmed) {
                        return; // User cancelled
                    }
                    showLoading();
                }

                // Validate IDs exist
                if (!doctorSelect.value || !machineSelect.value || !roomSelect.value) {
                    hideLoading();
                    showNotification('ข้อมูลไม่ครบถ้วน', 'กรุณาเลือกหมอ เครื่องมือ และห้องให้ครบถ้วน', 'error');
                    return;
                }

                // Check if selected IDs are valid
                const selectedDoctorExists = doctors.find(d => d.id === doctorSelect.value);
                const selectedMachineExists = machines.find(m => m.id === machineSelect.value);
                const selectedRoomExists = rooms.find(r => r.id === roomSelect.value);

                if (!selectedDoctorExists) {
                    hideLoading();
                    showNotification('ข้อมูลไม่ถูกต้อง', 'ไม่พบหมอที่เลือก กรุณาเลือกใหม่', 'error');
                    return;
                }

                if (!selectedMachineExists) {
                    hideLoading();
                    showNotification('ข้อมูลไม่ถูกต้อง', 'ไม่พบเครื่องมือที่เลือก กรุณาเลือกใหม่', 'error');
                    return;
                }

                if (!selectedRoomExists) {
                    hideLoading();
                    showNotification('ข้อมูลไม่ถูกต้อง', 'ไม่พบห้องที่เลือก กรุณาเลือกใหม่', 'error');
                    return;
                }

                console.log('Submitting booking:', formData);

                const endpoint = editingBookingId ? `/api/bookings/${editingBookingId}` : '/api/bookings';
                const method = editingBookingId ? 'PUT' : 'POST';
                
                const result = await apiCall(endpoint, {
                    method: method,
                    body: JSON.stringify(formData)
                });

                console.log('Booking result:', result);

                if (result && result.success) {
                    hideLoading();
                    const successMsg = editingBookingId ? 'แก้ไขการจองเรียบร้อยแล้ว' : 'บันทึกการจองเรียบร้อยแล้ว';
                    showNotification('บันทึกสำเร็จ!', successMsg, 'success');
                    
                    // Clear session storage
                    sessionStorage.removeItem('editingBookingId');
                    
                    // Redirect back to calendar after success
                    setTimeout(() => {
                        window.location.href = 'booking-calendar.html';
                    }, 1500);
                } else {
                    hideLoading();
                    showNotification('เกิดข้อผิดพลาด', result.message || 'ไม่สามารถบันทึกการจองได้', 'error');
                }
            } catch (error) {
                hideLoading();
                console.error('Error saving booking:', error);
                showNotification('เกิดข้อผิดพลาด', error.message || 'ไม่สามารถบันทึกการจองได้', 'error');
            }
        }

        // Initialize
        async function init() {
            checkAuth();
            await loadUserInfo();
            
            // Check if we're editing a booking
            const params = new URLSearchParams(window.location.search);
            editingBookingId = params.get('edit') || sessionStorage.getItem('editingBookingId');
            
            // Update header if editing
            if (editingBookingId) {
                const headerTitle = document.querySelector('span[class*="font-bold"]');
                if (headerTitle && headerTitle.textContent === 'สร้างนัดหมาย') {
                    headerTitle.textContent = 'แก้ไขนัดหมาย';
                }
            }
            
            await Promise.all([
                loadDoctors(),
                loadMachines(),
                loadRooms()
            ]);

            // If editing, load the booking data
            if (editingBookingId) {
                await loadBookingForEdit();
            }

            // Set default date to today (if not editing)
            const dateInput = document.getElementById('dateInput');
            if (dateInput && !editingBookingId) {
                dateInput.value = new Date().toISOString().split('T')[0];
                dateInput.min = new Date().toISOString().split('T')[0];
            }

            // Add change listeners for time inputs
            const startTimeInput = document.getElementById('startTimeInput');
            const endTimeInput = document.getElementById('endTimeInput');

            // Function to validate time range
            function validateTimeRange() {
                const start = startTimeInput.value;
                const end = endTimeInput.value;

                if (start && end) {
                    const [startHours, startMinutes] = start.split(':').map(Number);
                    const [endHours, endMinutes] = end.split(':').map(Number);

                    const startTotalMinutes = startHours * 60 + startMinutes;
                    const endTotalMinutes = endHours * 60 + endMinutes;

                    if (endTotalMinutes <= startTotalMinutes) {
                        endTimeInput.setCustomValidity('เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น');
                        endTimeInput.reportValidity();
                        return false;
                    } else {
                        endTimeInput.setCustomValidity('');
                        return true;
                    }
                }
                return true;
            }

            if (startTimeInput) {
                startTimeInput.addEventListener('change', () => {
                    // Auto-update end time to be 1 hour after start time
                    const start = startTimeInput.value;
                    if (start && !endTimeInput.value) {
                        const [hours, minutes] = start.split(':');
                        const endHour = (parseInt(hours) + 1).toString().padStart(2, '0');
                        endTimeInput.value = `${endHour}:${minutes}`;
                    }
                    validateTimeRange();
                });
            }

            if (endTimeInput) {
                endTimeInput.addEventListener('change', validateTimeRange);
            }

            // Attach submit handler
            const submitBtn = document.querySelector('button[class*="bg-sidebar-dark"]');
            if (submitBtn) {
                // Remove any existing listeners by cloning the button
                const newSubmitBtn = submitBtn.cloneNode(true);
                submitBtn.parentNode.replaceChild(newSubmitBtn, submitBtn);
                newSubmitBtn.addEventListener('click', handleSubmit);
            }

            // Back button
            const backBtn = document.querySelector('button span.material-symbols-outlined');
            if (backBtn && backBtn.textContent === 'arrow_back') {
                backBtn.parentElement.addEventListener('click', () => {
                    window.location.href = 'dashboard.html';
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
