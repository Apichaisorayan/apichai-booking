<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>User Management - Apichai</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#002a3a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/assets/logo.svg" />

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00bfa5",
                        "primary-dark": "#008f7a",
                        "background-light": "#F9FAFB",
                        "background-dark": "#111827",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1F2937",
                        "sidebar-dark": "#002a3a",
                    },
                    fontFamily: {
                        display: ["Sarabun", "sans-serif"],
                        body: ["Sarabun", "sans-serif"],
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: max(884px, 100dvh);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 antialiased pb-24">
    <header class="fixed top-0 left-0 right-0 z-50 bg-sidebar-dark text-white shadow-sm">
        <div class="h-14 flex items-center justify-between px-4 w-full">
            <div class="flex items-center gap-3">
                <img src="../assets/logo.svg" alt="Apichai"
                    class="w-10 h-10 rounded-xl object-cover ring-2 ring-white/40" />
                <div class="flex flex-col">
                    <span class="font-bold text-base leading-none tracking-wide">รายชื่อผู้ใช้</span>
                    <span class="text-[10px] text-primary/80 uppercase tracking-wider font-semibold">Apichai
                        Clinic</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleProfileMenu()" id="profileBtn"
                    class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-xs font-bold text-white shadow-sm ring-2 ring-white/10 hover:ring-4 hover:ring-white/20 transition">
                    AD
                </button>
            </div>
        </div>
    </header>

    <main class="pt-16 px-4 max-w-lg mx-auto w-full pb-safe">
        <!-- Search and Filter Section -->
        <div class="sticky top-14 bg-background-light dark:bg-background-dark py-3 z-40 space-y-3">
            <div class="relative">
                <span
                    class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 material-symbols-outlined text-[20px]">search</span>
                <input id="searchInput" type="text"
                    class="w-full pl-10 pr-4 py-2.5 rounded-xl border-none bg-white dark:bg-card-dark shadow-sm text-sm focus:ring-2 focus:ring-primary/50 dark:text-white placeholder-gray-400"
                    placeholder="ค้นหาชื่อ, อีเมล..." />
            </div>

            <!-- Role Filter -->
            <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                <button onclick="filterByRole('ALL')" id="filterAll"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap bg-primary text-white">
                    ทั้งหมด
                </button>
                <button onclick="filterByRole('ADMIN')" id="filterAdmin"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    ผู้ดูแลระบบ
                </button>
                <button onclick="filterByRole('DOCTOR')" id="filterDoctor"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    หมอ
                </button>
                <button onclick="filterByRole('SALES')" id="filterSales"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    ฝ่ายขาย
                </button>
                <button onclick="filterByRole('CRM')" id="filterCrm"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-medium whitespace-nowrap bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
                    CRM
                </button>
            </div>
        </div>

        <!-- User Count and Add Button -->
        <div class="flex items-center justify-between mb-4 mt-2">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                <span id="userCount">0</span> ผู้ใช้
            </p>
            <button onclick="openUserModal()"
                class="px-4 py-2 bg-primary text-white rounded-lg text-xs font-medium shadow-sm hover:bg-primary-dark transition-colors flex items-center gap-1">
                <span class="material-symbols-outlined text-[16px]">add</span>
                เพิ่มผู้ใช้
            </button>
        </div>

        <!-- User List -->
        <div id="userListContainer" class="space-y-3">
            <!-- Users will be loaded by JavaScript -->
        </div>
    </main>

    <!-- User Modal -->
    <div id="userModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
        <div class="bg-white dark:bg-card-dark w-full max-w-lg rounded-t-3xl shadow-xl max-h-[90vh] overflow-y-auto">
            <div
                class="sticky top-0 bg-white dark:bg-card-dark border-b border-gray-200 dark:border-gray-700 px-4 py-4 flex items-center justify-between">
                <h2 id="modalTitle" class="text-lg font-bold text-gray-900 dark:text-white">เพิ่มผู้ใช้ใหม่</h2>
                <button onclick="closeUserModal()"
                    class="p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <span class="material-symbols-outlined text-gray-500">close</span>
                </button>
            </div>
            <form id="userForm" class="p-4 space-y-4">
                <input type="hidden" id="editUserId" />

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">ชื่อ-นามสกุล</label>
                    <input id="userName" type="text" required
                        class="w-full bg-gray-50 dark:bg-gray-800 border-0 rounded-xl px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary"
                        placeholder="กรอกชื่อ-นามสกุล" />
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">อีเมล</label>
                    <input id="userEmail" type="email" required
                        class="w-full bg-gray-50 dark:bg-gray-800 border-0 rounded-xl px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary"
                        placeholder="example@email.com" />
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">รหัสผ่าน</label>
                    <input id="userPassword" type="password" required
                        class="w-full bg-gray-50 dark:bg-gray-800 border-0 rounded-xl px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary"
                        placeholder="กรอกรหัสผ่าน" />
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">บทบาท</label>
                    <select id="userRole" required
                        class="w-full bg-gray-50 dark:bg-gray-800 border-0 rounded-xl px-4 py-3 text-sm text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary">
                        <option value="">เลือกบทบาท</option>
                        <option value="ADMIN">ผู้ดูแลระบบ</option>
                        <option value="DOCTOR">หมอ</option>
                        <option value="SALES">ฝ่ายขาย</option>
                        <option value="CRM">CRM</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeUserModal()"
                        class="flex-1 py-3 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-xl font-medium">
                        ยกเลิก
                    </button>
                    <button type="submit"
                        class="flex-1 py-3 bg-primary text-white rounded-xl font-medium shadow-sm hover:bg-primary-dark transition-colors">
                        บันทึก
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-card-dark/95 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 py-2 px-4 flex justify-between items-center z-40 text-[10px] pb-safe">
        <a class="flex flex-col items-center gap-1 text-primary" href="users.html">
            <span class="material-symbols-outlined text-2xl">group</span>
            <span class="font-medium">รายชื่อ</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition"
            href="booking-calendar.html">
            <span class="material-symbols-outlined text-2xl">calendar_month</span>
            <span class="font-medium">นัดหมาย</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition relative -mt-6"
            href="dashboard.html">
            <div
                class="w-14 h-14 rounded-full bg-gradient-to-br from-primary to-primary-dark shadow-lg flex items-center justify-center mb-1 ring-4 ring-white dark:ring-gray-800">
                <span class="material-symbols-outlined text-white text-2xl">dashboard</span>
            </div>
            <span class="font-medium text-gray-400 dark:text-gray-500">ภาพรวม</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition"
            href="rooms.html">
            <span class="material-symbols-outlined text-2xl">meeting_room</span>
            <span class="font-medium">ห้อง</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition"
            href="machines.html">
            <span class="material-symbols-outlined text-2xl">medical_services</span>
            <span class="font-medium">เครื่องมือ</span>
        </a>
    </nav>

    <script>
        // Configuration - Auto-detect environment
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8787'
            : window.location.hostname.match(/^192\.168\.\d+\.\d+$/) || window.location.hostname.match(/^10\.\d+\.\d+\.\d+$/)
                ? `http://${window.location.hostname}:8787`
                : window.location.hostname.includes('qa.')
                    ? 'https://beauty-clinic-api-qa.apichais-leo01.workers.dev'
                    : 'https://beauty-clinic-api.apichais-leo01.workers.dev';

        // Profile menu toggle
        function toggleProfileMenu() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        // Close profile menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('profileMenu');
            const profileBtn = document.getElementById('profileBtn');
            if (!menu.contains(e.target) && !profileBtn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // Logout function
        async function handleLogout() {
            document.getElementById('profileMenu').classList.add('hidden');
            const confirmed = await showConfirmDialog(
                'ออกจากระบบ',
                'คุณต้องการออกจากระบบใช่หรือไม่?'
            );

            if (confirmed) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('google_calendar_token');
                sessionStorage.removeItem('google_calendar_refresh_token');
                window.location.href = '/';
            }
        }

        // Loading dialog functions
        function showLoading() {
            document.getElementById('loadingDialog').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingDialog').classList.add('hidden');
        }

        // Custom confirmation dialog
        function showConfirmDialog(title, message) {
            return new Promise((resolve) => {
                const dialog = document.getElementById('confirmDialog');
                const titleEl = document.getElementById('confirmTitle');
                const messageEl = document.getElementById('confirmMessage');
                const okBtn = document.getElementById('confirmOkBtn');
                const cancelBtn = document.getElementById('confirmCancelBtn');

                titleEl.textContent = title;
                messageEl.textContent = message;
                dialog.classList.remove('hidden');

                const handleOk = () => {
                    dialog.classList.add('hidden');
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(true);
                };

                const handleCancel = () => {
                    dialog.classList.add('hidden');
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(false);
                };

                okBtn.addEventListener('click', handleOk);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        let allUsers = [];
        let filteredUsers = [];
        let currentFilter = 'ALL';

        // Auth check
        function checkAuth() {
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return null;
            }
            return token;
        }

        // API call helper
        async function apiCall(endpoint, options = {}) {
            const token = checkAuth();
            if (!token) return null;

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            };

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    ...options,
                    headers
                });

                const responseData = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        sessionStorage.removeItem('token');
                        sessionStorage.removeItem('user');
                        window.location.href = '/';
                        return null;
                    }
                    throw new Error(responseData.error || responseData.message || `HTTP ${response.status}`);
                }

                return responseData;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // Load current user info
        async function loadUserInfo() {
            try {
                const user = JSON.parse(sessionStorage.getItem('user') || '{}');
                if (user.name) {
                    const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                    const avatars = document.querySelectorAll('.w-8.h-8, .w-12.h-12');
                    avatars.forEach(avatar => {
                        if (avatar.textContent.trim() === 'AD') {
                            avatar.textContent = initials;
                        }
                    });

                    document.getElementById('profileName').textContent = user.name || 'User';
                    document.getElementById('profileEmail').textContent = user.email || '';

                    const avatar = document.getElementById('userAvatar');
                    if (avatar) {
                        avatar.textContent = initials;
                    }
                }
            } catch (error) {
                console.error('Error loading user:', error);
            }
        }

        // Load users from API
        async function loadUsers() {
            try {
                const users = await apiCall('/api/users');
                allUsers = users || [];
                filterByRole(currentFilter);
            } catch (error) {
                console.error('Error loading users:', error);
                showNotification('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลผู้ใช้', 'error');
            }
        }

        // Filter users by role
        function filterByRole(role) {
            currentFilter = role;

            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-gray-100', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
            });

            const activeBtn = document.getElementById(`filter${role === 'ALL' ? 'All' : role.charAt(0) + role.slice(1).toLowerCase()}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-gray-100', 'dark:bg-gray-700', 'text-gray-700', 'dark:text-gray-300');
                activeBtn.classList.add('bg-primary', 'text-white');
            }

            // Filter users
            if (role === 'ALL') {
                filteredUsers = [...allUsers];
            } else {
                filteredUsers = allUsers.filter(u => u.role === role);
            }

            renderUsers();
        }

        // Search users
        function searchUsers(query) {
            if (!query) {
                renderUsers();
                return;
            }

            const searchLower = query.toLowerCase();
            const searchResults = filteredUsers.filter(u =>
                u.name?.toLowerCase().includes(searchLower) ||
                u.email?.toLowerCase().includes(searchLower)
            );

            renderUsers(searchResults);
        }

        // Render users to UI
        function renderUsers(usersToRender = null) {
            const users = usersToRender || filteredUsers;
            const container = document.getElementById('userListContainer');
            const countElement = document.getElementById('userCount');

            if (!container) return;

            // Update count
            if (countElement) {
                countElement.textContent = users.length;
            }

            if (users.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <span class="material-symbols-outlined text-4xl mb-2">person_off</span>
                        <p class="text-sm">ไม่พบผู้ใช้</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = users.map(user => {
                const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                const roleColors = {
                    'ADMIN': 'bg-red-100 text-red-700 dark:bg-red-900/20 dark:text-red-400',
                    'DOCTOR': 'bg-blue-100 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400',
                    'SALES': 'bg-green-100 text-green-700 dark:bg-green-900/20 dark:text-green-400',
                    'CRM': 'bg-purple-100 text-purple-700 dark:bg-purple-900/20 dark:text-purple-400'
                };
                const roleText = {
                    'ADMIN': 'ผู้ดูแลระบบ',
                    'DOCTOR': 'หมอ',
                    'SALES': 'ฝ่ายขาย',
                    'CRM': 'CRM'
                };

                return `
                    <div class="bg-white dark:bg-card-dark p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                                ${initials}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-sm text-gray-800 dark:text-white truncate">${user.name}</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${user.email}</p>
                                <span class="inline-block mt-1 px-2 py-0.5 rounded-md text-[10px] font-medium ${roleColors[user.role] || 'bg-gray-100 text-gray-700'}">
                                    ${roleText[user.role] || user.role}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-2 mt-3 pt-3 border-t border-gray-100 dark:border-gray-700">
                            <button onclick="editUser('${user.id}')" class="flex-1 py-2 px-3 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-medium hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[16px]">edit</span>
                                แก้ไข
                            </button>
                            <button onclick="deleteUser('${user.id}', '${user.name}')" class="flex-1 py-2 px-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-lg text-xs font-medium hover:bg-red-100 dark:hover:bg-red-900/30 transition-colors flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[16px]">delete</span>
                                ลบ
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show notification
        function showNotification(title, message, type = 'info') {
            const dialog = document.getElementById('notificationDialog');
            const icon = document.getElementById('notificationIcon');
            const iconSpan = icon.querySelector('.material-symbols-outlined');
            const titleEl = document.getElementById('notificationTitle');
            const messageEl = document.getElementById('notificationMessage');
            const okBtn = document.getElementById('notificationOkBtn');

            titleEl.textContent = title;
            messageEl.textContent = message;

            // Reset classes
            icon.className = 'flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full';
            okBtn.className = 'w-full px-4 py-2.5 rounded-xl font-medium hover:opacity-90 transition';

            if (type === 'error') {
                icon.classList.add('bg-red-100', 'dark:bg-red-900/20');
                iconSpan.className = 'material-symbols-outlined text-red-600 dark:text-red-400 text-2xl';
                iconSpan.textContent = 'error';
                okBtn.classList.add('bg-red-600', 'text-white');
            } else if (type === 'success') {
                icon.classList.add('bg-green-100', 'dark:bg-green-900/20');
                iconSpan.className = 'material-symbols-outlined text-green-600 dark:text-green-400 text-2xl';
                iconSpan.textContent = 'check_circle';
                okBtn.classList.add('bg-green-600', 'text-white');
            } else {
                icon.classList.add('bg-blue-100', 'dark:bg-blue-900/20');
                iconSpan.className = 'material-symbols-outlined text-blue-600 dark:text-blue-400 text-2xl';
                iconSpan.textContent = 'info';
                okBtn.classList.add('bg-primary', 'text-white');
            }

            dialog.classList.remove('hidden');

            const handleOk = () => {
                dialog.classList.add('hidden');
                okBtn.removeEventListener('click', handleOk);
            };

            okBtn.addEventListener('click', handleOk);
        }

        // Open user modal for create/edit
        function openUserModal(userId = null) {
            const modal = document.getElementById('userModal');
            const form = document.getElementById('userForm');
            const title = document.getElementById('modalTitle');
            const editUserIdInput = document.getElementById('editUserId');
            const passwordInput = document.getElementById('userPassword');

            form.reset();

            if (userId) {
                // Edit mode
                title.textContent = 'แก้ไขผู้ใช้';
                editUserIdInput.value = userId;
                passwordInput.required = false;

                // Load user data
                const user = allUsers.find(u => u.id === userId);
                if (user) {
                    document.getElementById('userName').value = user.name;
                    document.getElementById('userEmail').value = user.email;
                    document.getElementById('userRole').value = user.role;
                }
            } else {
                // Create mode
                title.textContent = 'เพิ่มผู้ใช้ใหม่';
                editUserIdInput.value = '';
                passwordInput.required = true;
            }

            modal.classList.remove('hidden');
        }

        // Close user modal
        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
            document.getElementById('userForm').reset();
        }

        // Edit user
        function editUser(userId) {
            openUserModal(userId);
        }

        // Delete user
        async function deleteUser(userId, userName) {
            const confirmed = await showConfirmDialog(
                'ลบผู้ใช้',
                `คุณต้องการลบผู้ใช้ "${userName}" ใช่หรือไม่?`
            );
            if (!confirmed) {
                return;
            }

            try {
                showLoading();
                await apiCall(`/api/users/${userId}`, {
                    method: 'DELETE'
                });

                hideLoading();
                showNotification('ลบสำเร็จ', 'ลบผู้ใช้เรียบร้อยแล้ว', 'success');
                await loadUsers();
            } catch (error) {
                hideLoading();
                showNotification('เกิดข้อผิดพลาด', 'ไม่สามารถลบผู้ใช้ได้', 'error');
            }
        }

        // Handle form submit
        document.getElementById('userForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const editUserIdInput = document.getElementById('editUserId');
            const userData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                role: document.getElementById('userRole').value
            };

            const password = document.getElementById('userPassword').value;
            if (password) {
                userData.password = password;
            }

            try {
                showLoading();
                if (editUserIdInput.value) {
                    // Update existing user
                    await apiCall(`/api/users/${editUserIdInput.value}`, {
                        method: 'PUT',
                        body: JSON.stringify(userData)
                    });
                    hideLoading();
                    showNotification('บันทึกสำเร็จ', 'แก้ไขผู้ใช้เรียบร้อยแล้ว', 'success');
                } else {
                    // Create new user
                    await apiCall('/api/users', {
                        method: 'POST',
                        body: JSON.stringify(userData)
                    });
                    hideLoading();
                    showNotification('สร้างสำเร็จ', 'สร้างผู้ใช้เรียบร้อยแล้ว', 'success');
                }

                closeUserModal();
                await loadUsers();
            } catch (error) {
                hideLoading();
                showNotification('เกิดข้อผิดพลาด', error.message, 'error');
            }
        });

        // Initialize
        async function init() {
            checkAuth();
            await loadUserInfo();
            await loadUsers();

            // Search input listener
            document.getElementById('searchInput')?.addEventListener('input', (e) => {
                searchUsers(e.target.value);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

    <!-- Profile Menu -->
    <div id="profileMenu" class="hidden fixed top-16 right-4 z-[60] w-64">
        <div
            class="bg-white dark:bg-card-dark rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden">
            <div
                class="p-4 bg-gradient-to-br from-primary/10 to-primary-dark/10 border-b border-gray-100 dark:border-gray-700">
                <div class="flex items-center gap-3">
                    <div
                        class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-sm font-bold text-white shadow-sm">
                        AD
                    </div>
                    <div class="flex-1">
                        <p id="profileName" class="font-semibold text-gray-900 dark:text-white text-sm">User</p>
                        <p id="profileEmail" class="text-xs text-gray-500 dark:text-gray-400"></p>
                    </div>
                </div>
            </div>
            <div class="py-2">
                <button onclick="handleLogout()"
                    class="w-full px-4 py-3 flex items-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition text-left">
                    <span class="material-symbols-outlined text-red-600 dark:text-red-400 text-xl">logout</span>
                    <span class="text-sm font-medium text-red-600 dark:text-red-400">ออกจากระบบ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Dialog -->
    <div id="loadingDialog" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center">
        <div class="bg-white dark:bg-card-dark rounded-2xl shadow-xl p-6 flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-sm font-medium text-gray-700 dark:text-gray-300">กำลังดำเนินการ...</p>
        </div>
    </div>

    <!-- Custom Notification Dialog -->
    <div id="notificationDialog" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center px-4">
        <div class="bg-white dark:bg-card-dark rounded-2xl shadow-xl max-w-sm w-full transform transition-all">
            <div class="p-6">
                <div id="notificationIcon" class="flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full">
                    <span class="material-symbols-outlined text-2xl"></span>
                </div>
                <h3 id="notificationTitle" class="text-lg font-bold text-gray-900 dark:text-white text-center mb-2">
                </h3>
                <p id="notificationMessage" class="text-sm text-gray-600 dark:text-gray-400 text-center mb-6"></p>
                <button id="notificationOkBtn"
                    class="w-full px-4 py-2.5 bg-primary text-white rounded-xl font-medium hover:bg-primary/90 transition">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Dialog -->
    <div id="confirmDialog" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center px-4">
        <div class="bg-white dark:bg-card-dark rounded-2xl shadow-xl max-w-sm w-full transform transition-all">
            <div class="p-6">
                <div
                    class="flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full bg-orange-100 dark:bg-orange-900/20">
                    <span class="material-symbols-outlined text-orange-600 dark:text-orange-400 text-2xl">warning</span>
                </div>
                <h3 id="confirmTitle" class="text-lg font-bold text-gray-900 dark:text-white text-center mb-2"></h3>
                <p id="confirmMessage" class="text-sm text-gray-600 dark:text-gray-400 text-center mb-6"></p>
                <div class="flex gap-3">
                    <button id="confirmCancelBtn"
                        class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                        ยกเลิก
                    </button>
                    <button id="confirmOkBtn"
                        class="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-xl font-medium hover:bg-red-700 transition">
                        ยืนยัน
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
